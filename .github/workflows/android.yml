name: Android APK

# Manual only: the APK holds code recompiled from the game.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Android SDK packages
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          [ -x "$SDKM" ] || { echo "::error::No sdkmanager under $ANDROID_HOME/cmdline-tools: $(ls "$ANDROID_HOME" | tr '\n' ' ')"; exit 1; }
          echo "sdkmanager: $SDKM"
          (yes || true) | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --list > "$RUNNER_TEMP/sdk-list.txt" 2>&1 || true
          # Prefer the exact pinned packages; report what exists when one is missing.
          pick() {
            if grep -q "^ *$1 " "$RUNNER_TEMP/sdk-list.txt"; then echo "$1"; return; fi
            local found
            found=$(grep -o "^ *$2[^ ]*" "$RUNNER_TEMP/sdk-list.txt" | tr -d ' ' | sort -uV | tail -1)
            echo "::warning::$1 not offered; available: $(grep -o "^ *$2[^ ]*" "$RUNNER_TEMP/sdk-list.txt" | tr -d ' ' | sort -uV | tr '\n' ' ')" >&2
            echo "$found"
          }
          PLATFORM=$(pick "platforms;android-37.0" "platforms;android-37")
          NDK=$(pick "ndk;30.0.16248370" "ndk;30")
          CMAKE=$(pick "cmake;4.1.2" "cmake;4")
          echo "Installing $PLATFORM $NDK $CMAKE"
          if ! "$SDKM" --install "$PLATFORM" "$NDK" "$CMAKE" > "$RUNNER_TEMP/sdk-install.txt" 2>&1; then
            echo "::error::sdkmanager failed: $(tail -c 1500 "$RUNNER_TEMP/sdk-install.txt" | tr '\n' ' ')"
            exit 1
          fi
          tail -5 "$RUNNER_TEMP/sdk-install.txt"

      - name: Download default.xbe
        env:
          NFSU_XBE_URL: ${{ secrets.NFSU_XBE_URL }}
        run: |
          if [ -z "$NFSU_XBE_URL" ]; then
            echo "::error::Add the NFSU_XBE_URL secret (Settings -> Secrets and variables -> Actions): a direct HTTPS link to your NTSC-U default.xbe."
            exit 1
          fi
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/default.xbe" "$NFSU_XBE_URL"
          head -c 4 "$RUNNER_TEMP/default.xbe" | grep -q XBEH || { echo "::error::The NFSU_XBE_URL download is not an XBE file."; exit 1; }
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "nfsu.xbe=$RUNNER_TEMP/default.xbe"
          } > local.properties

      - name: Signing key
        env:
          NFSU_KEYSTORE_B64: ${{ secrets.NFSU_KEYSTORE_B64 }}
        run: |
          if [ -z "$NFSU_KEYSTORE_B64" ]; then
            echo "::warning::No NFSU_KEYSTORE_B64 secret: the APK gets a new debug key and cannot update the previous install."
            exit 0
          fi
          echo "$NFSU_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nfsux.jks"
          echo "NFSU_KEYSTORE=$RUNNER_TEMP/nfsux.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          NFSU_KEYSTORE_PASSWORD: ${{ secrets.NFSU_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug lintDebug 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Report build errors
        if: failure()
        run: |
          [ -f "$RUNNER_TEMP/build.log" ] || exit 0
          # Annotations are readable without the full log.
          grep -nE "error:|FAILED|What went wrong|Exception|fatal" "$RUNNER_TEMP/build.log" | head -40 \
            | while IFS= read -r line; do echo "::error::${line:0:900}"; done
          echo "::error::tail: $(tail -c 3000 "$RUNNER_TEMP/build.log" | tr '\n' ' ')"

      - name: Name the APK
        run: |
          mkdir -p "$RUNNER_TEMP/apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/apk/NFSU-X.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: NFSU-X-${{ github.sha }}
          path: ${{ runner.temp }}/apk/NFSU-X.apk
          retention-days: 1
