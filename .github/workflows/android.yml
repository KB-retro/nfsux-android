name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37" "ndk;30.0.16248370" "cmake;4.1.2"

      - name: Download default.xbe
        env:
          NFSU_XBE_URL: ${{ secrets.NFSU_XBE_URL }}
        run: |
          if [ -z "$NFSU_XBE_URL" ]; then
            echo "::error::Add the NFSU_XBE_URL secret (Settings -> Secrets and variables -> Actions): a direct HTTPS link to your NTSC-U default.xbe."
            exit 1
          fi
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/default.xbe" "$NFSU_XBE_URL"
          head -c 4 "$RUNNER_TEMP/default.xbe" | grep -q XBEH || { echo "::error::The NFSU_XBE_URL download is not an XBE file."; exit 1; }
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "nfsu.xbe=$RUNNER_TEMP/default.xbe"
          } > local.properties

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew --no-daemon assembleDebug lintDebug

      - uses: actions/upload-artifact@v4
        with:
          name: nfsu1-android-arm64-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
